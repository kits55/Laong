<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#15262B">
  <title>Laong · สมุดบันทึกการทดลอง</title>
  <link rel="icon" href="icons/laong.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <link rel="stylesheet" href="monitor.css">
  <script defer src="reports.js"></script>
  <script defer src="workspace.js"></script>
  <script defer src="calendar.js"></script>
  <script defer src="previews.js"></script>
  <script defer src="admin.js"></script>
  <script defer src="monitor.js"></script>
  <script defer src="mascot.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#content">ข้ามไปเนื้อหา</a>
  <div class="shell">
    <aside class="rail">
      <a class="brand" href="#today"><img alt="" src="icons/laong.svg"><span>LaOng <small>ละออง</small></span></a>
      <nav id="navigation" aria-label="เมนูหลัก"></nav>
      <div class="rail-footer"><span class="rail-indicator"></span><div>พื้นที่ทดลองบนเครื่อง<small>ข้อมูลอยู่ในเบราว์เซอร์นี้</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><span id="breadcrumb">สมุดบันทึกการทดลอง</span><span class="mode-label"><time id="lab-clock" class="mono"></time> เวลาไทย</span></header>
      <main id="content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="create-dialog" aria-labelledby="create-title">
    <form id="create-form">
      <div class="dialog-head"><h2 id="create-title">สร้างการทดลอง</h2><button class="button subtle" type="button" data-action="cancel-create">ปิด</button></div>
      <label>ชื่อการทดลอง<input required maxlength="100" name="title" placeholder="เช่น ทดลองทำผงสูตรตัวอย่าง" autofocus></label>
      <label>แบบฟอร์ม<select name="template" id="template-select" aria-describedby="template-help"></select></label>
      <p class="muted" id="template-help"></p>
      <p id="create-error" class="field-error" role="alert" hidden></p>
      <div id="create-pending" class="create-pending" role="status" hidden>
        <img src="icons/mascot-wait.svg" width="44" height="48" alt="">
        <span>กำลังบันทึกร่างการทดลอง</span>
      </div>
      <div class="dialog-actions"><button class="button" type="button" data-action="cancel-create">ยกเลิก</button><button class="button primary">สร้างรัน</button></div>
    </form>
  </dialog>
  <dialog id="machine-dialog" class="drawer" aria-labelledby="machine-title">
    <form id="machine-form" novalidate>
      <div class="dialog-head"><div><h2 id="machine-title">เพิ่มเครื่องใหม่</h2><p class="muted">ทีมวิจัย A</p></div><button class="button subtle" type="button" data-action="cancel-machine">ปิด</button></div>
      <div id="machine-preview"></div>
      <label>ชื่อเรียกเครื่อง<input name="name" maxlength="40" placeholder="เช่น เครื่องห้องแล็บ 2" aria-describedby="machine-help machine-error" autofocus></label>
      <div class="field-note" id="machine-help"><small>ชื่อที่ทีมใช้เรียก 2 ถึง 40 ตัวอักษร</small><small id="machine-count" class="mono">0/40</small></div>
      <p id="machine-error" class="field-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="button subtle" type="button" data-action="delete-machine" hidden>ลบเครื่อง</button><button class="button" type="button" data-action="cancel-machine">ยกเลิก</button><button class="button primary">เพิ่มเครื่อง</button></div>
    </form>
  </dialog>
  <dialog id="visit-dialog" aria-labelledby="visit-title">
    <form id="visit-form">
      <div class="dialog-head"><h2 id="visit-title">วางแผนเข้าแล็บ</h2><button class="button subtle" type="button" data-visit-action="close">ปิด</button></div>
      <label>ชื่องาน<input required maxlength="100" name="title" placeholder="เช่น เตรียมตัวอย่างสำหรับรัน" autofocus></label>
      <label>วันที่เข้าแล็บ<input required type="date" name="date" min="1901-01-01" max="9998-12-31"></label>
      <div class="field-grid"><label>เวลาเริ่ม<input required type="time" name="start"></label><label>เวลาสิ้นสุด (ถ้ามี)<input type="time" name="end"></label></div>
      <p class="hint">เวลาไทย (UTC+7)</p>
      <p class="field-error" id="visit-error" role="alert" hidden></p>
      <div class="dialog-actions"><button class="button subtle" id="delete-visit" type="button" data-visit-action="delete" hidden>ลบรายการ</button><button class="button primary">บันทึกแผน</button></div>
    </form>
  </dialog>
  <p id="notification" class="notification" role="status" hidden></p>
  <p id="storage-alert" class="storage-alert" role="alert" hidden></p>
  <section id="print-report" aria-label="รายงานการทดลอง"></section>
  <dialog id="delete-confirmation" aria-labelledby="delete-confirmation-title" aria-describedby="delete-confirmation-detail">
    <form method="dialog">
      <h2 id="delete-confirmation-title"></h2>
      <p id="delete-confirmation-detail" class="muted"></p>
      <div class="dialog-actions">
        <button class="button" value="cancel" autofocus>ยกเลิก</button>
        <button class="button destructive" value="delete">ยืนยันการลบ</button>
      </div>
    </form>
  </dialog>
</body>
</html>
